/* Motor común de juegos anavictoria.ia: reto con opciones + tablero visual a la izquierda, ficha a la derecha; final con y sin. Paleta Saltimvanki. */
:root{

  --c1:#FBD44C; --c1-ink:#23262B; --c2:#F4728C; --c2-ink:#23262B; --c3:#33356B; --c3-ink:#FFFFFF;

}

  --bg:#1B1C21; --surface:#25272E; --fg:#F4EFE3; --muted:#B7B0A0; --line:#3A3C46; --soft:#2B2D35;

  --accent:#FBD44C; --accent-ink:#23262B; --ok:#6FD195; --bad:#FF8C83; --c3:#4B4E9A; --c6:#0F1014; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

p{margin:0}
a{color:inherit}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}

.stats{display:flex;gap:18px;align-items:center;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;line-height:1.2}
.stat b{font-size:1.25rem}
.stat small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}

.play{display:flex;flex-direction:column;gap:18px;min-width:0}

.reto h2{font-size:1.12rem;font-weight:700}

.ctx dt{font-size:.78rem;color:var(--muted);font-weight:600}
.ctx dd{margin:0;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;color:var(--fg);text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-1px);border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.opt .tx{min-width:0}
.opt .ans{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.opt.shake{animation:shake .4s;border-color:var(--bad)}
.opt:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{min-height:1.4em;font-weight:600;font-size:.92rem}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}

/* tableros visuales */
.vis{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.vis>.eyebrow{margin-bottom:2px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:.85rem}
.fill{animation:in .45s cubic-bezier(.2,.9,.3,1.2)}

.funnel{align-items:center;gap:5px}
.funnel .band{text-align:center;font-weight:600;font-size:.85rem;padding:9px 12px;border-radius:8px;min-width:0}
.funnel .band.slot{border-radius:8px}
.chiprow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--bg)}
.chiprow .tag{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px}
.chiprow .tx{font-size:.88rem;min-width:0}
.bubble{max-width:92%;padding:8px 12px;border-radius:14px;font-size:.88rem}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble .st{display:block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bin{border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.bin h3{font-size:.8rem;font-weight:700}

.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;height:190px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-variant-numeric:tabular-nums}
.day .col{width:100%;border-radius:8px 8px 4px 4px;background:var(--soft);transition:height .6s}
.day.on .col{background:var(--hl)}
.day b{font-size:.85rem} .day small{font-size:.72rem;color:var(--muted)}
.ficha{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:.86rem;padding:6px 0;border-bottom:1px solid var(--line)}
.frow dt{font-weight:700;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.frow dd{margin:0}
.frow dd.empty{color:var(--muted)}
.mail{background:var(--bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.mail .line{min-height:1.2em}
.mail .line.empty{height:12px;border-radius:6px;background:var(--soft)}
.mail .subj{font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}

.chip{display:inline-flex;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;align-self:flex-start;background:var(--hl);color:#23262B}
.panel h3{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.example{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:.92rem}
.warn{border-left:4px solid var(--bad);padding:6px 12px;font-size:.9rem}
.steps{display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.steps b{color:var(--fg)}
#finale{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px}

.prompt{font-weight:600;background:var(--bg);border-radius:10px;padding:10px 14px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.answer{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);min-width:0}
.answer.with{border:2px solid var(--accent)}
.answer h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.answer .res{font-weight:700}
.answer .note{font-size:.85rem;color:var(--muted)}
.answer .box{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem}
.answer ol,.answer ul{margin:0;padding-left:1.2em;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
footer{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  shuffle(r.opts.map((o,k)=>({...o,k}))).forEach((o,j)=>{
    const b=document.createElement('button');b.type='button';b.className='opt';
    b.innerHTML=`<span class="k">${'ABCD'[j]}</span><span class="tx">${o.t}${st.mode==='explorar'&&o.k===r.ok?'<span class="ans">Respuesta</span>':''}</span>`;
    b.addEventListener('click',()=>choose(o.k,b));b.addEventListener('animationend',()=>b.classList.remove('shake'));opts.appendChild(b);
  });
}
function choose(k,b){
  const r=R[st.i];
  if(st.mode==='explorar'||k===r.ok){
    let pts=0;if(st.mode==='reto'){pts=st.tries===0?100:st.tries===1?50:25;st.score+=pts}
    st.tries=0;st.done.push(st.i);showInfo(r.info);st.i++;
    fb('ok',st.mode==='reto'?`Correcto. +${pts} puntos`:'Respuesta correcta');render();
    if(st.i>=N)setTimeout(finale,600);
  }else{
    st.tries++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    fb('bad','No es la mejor. '+(r.opts[k].why||''));
  }
}
const COL=k=>`background:var(--c${k%6+1});color:var(--c${k%6+1}-ink)`;
function vis(){
  const v=$('vis'),V=CFG.vis,done=new Set(st.done);let h=`<p class="eyebrow">${V.title}</p>`;
  if(V.type==='funnel'){v.className='vis funnel';R.forEach((r,i)=>{const w=100-i*(45/(N-1));
    h+=done.has(i)?`<div class="band fill" style="width:${w}%;${COL(i)}">${i+1}. ${r.b}</div>`:`<div class="band slot" style="width:${w}%">Paso ${i+1}</div>`})}
  else if(V.type==='chips'){v.className='vis';R.forEach((r,i)=>{h+=done.has(i)?`<div class="chiprow fill"><span class="tag" style="${COL(i)}">${r.tag}</span><span class="tx">${r.b}</span></div>`:`<div class="slot">${V.slot} ${i+1}</div>`})}
  else if(V.type==='chat'){v.className='vis';R.forEach((r,i)=>{h+=done.has(i)?`<div class="bubble me fill"><span class="st">${r.tag}</span>${r.b}</div>`:`<div class="slot">${V.slot} ${i+1}: ${r.tag}</div>`})}
  else if(V.type==='bins'){v.className='vis';h+='<div class="bins">'+V.bins.map((bn,j)=>{const ppl=R.filter((r,i)=>done.has(i)&&r.ok===j).map(r=>`<span class="fill">${r.b}</span>`).join('');
      return `<div class="bin" style="${COL(j)}"><h3>${bn}</h3><div class="ppl">${ppl}</div></div>`}).join('')+'</div>'}
  else if(V.type==='days'){v.className='vis';const mx=Math.max(...R.map(r=>r.v));h+='<div class="days">'+R.map((r,i)=>{const on=done.has(i);
      return `<div class="day ${on?'on':''}"><b>${on?r.v:''}</b><div class="col" style="height:${on?Math.max(6,r.v/mx*130):6}px"></div><small>${r.tag}</small></div>`}).join('')+'</div>';
      const tot=R.filter((r,i)=>done.has(i)).reduce((a,r)=>a+r.v,0);h+=`<p class="eyebrow" style="text-align:right">${V.total}: ${tot}</p>`}
  else if(V.type==='ficha'){v.className='vis';h+='<dl class="ficha">'+R.map((r,i)=>`<div class="frow"><dt>${r.tag}</dt><dd class="${done.has(i)?'fill':'empty'}">${done.has(i)?r.b:'Por completar'}</dd></div>`).join('')+'</dl>'}
  else if(V.type==='email'){v.className='vis';h+='<div class="mail">'+R.map((r,i)=>done.has(i)?`<div class="line fill ${i===0?'subj':''}">${i===0?'Asunto: ':''}${r.b}</div>`:`<div class="line empty" title="${r.tag}"></div>`).join('')+'</div>'}
  v.innerHTML=h;
}
function showInfo(f){
  $('info').innerHTML=`<span class="chip">${f.chip}</span><h2>${f.title}</h2><p>${f.que}</p>
  ${f.lista?`<div><h3>${f.lh||'Qué lleva'}</h3><ul>${f.lista.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  ${f.ejemplo?`<div><h3>Ejemplo</h3><p class="example">${f.ejemplo}</p></div>`:''}
  ${f.error?`<div><h3>Error típico</h3><p class="warn">${f.error}</p></div>`:''}`;
}
function intro(){$('info').innerHTML=`<p class="eyebrow">Cómo se juega</p><h2>${CFG.intro.h2}</h2><p>${CFG.intro.p}</p>
  <div class="steps"><p><b>Modo reto:</b> ${CFG.intro.reto} 100 puntos a la primera, 50 a la segunda y 25 después.</p>
  <p><b>Modo explorar:</b> la respuesta correcta aparece marcada. Sirve para presentarlo en un taller o en una reunión.</p>
  <p><b>Al final:</b> ${CFG.intro.final}</p></div>`}
function finale(){
  const F=CFG.finale,f=$('finale');
  f.innerHTML=`<p class="eyebrow">${F.eyebrow} · ${st.mode==='reto'?st.score+' de '+N*100+' puntos':'modo explorar'}</p><h2>${F.h2}</h2>
  ${F.prompt?`<p class="prompt">${F.prompt}</p>`:''}
  <div class="compare"><div class="answer"><h3>${F.sin.h3}</h3>${F.sin.html}</div><div class="answer with"><h3>${F.con.h3}</h3>${F.con.html}</div></div>
  <div class="btns"><button class="btn" id="again">Jugar otra vez</button><button class="btn ghost" id="explore">Repasar en modo explorar</button></div>`;
  f.hidden=false;
  $('again').addEventListener('click',()=>{reset();window.scrollTo({top:0,behavior:'smooth'})});
  $('explore').addEventListener('click',()=>{st.mode='explorar';reset();window.scrollTo({top:0,behavior:'smooth'})});
  try{f.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}catch(e){}
}
$('mode-reto').addEventListener('click',()=>{st.mode='reto';st.tries=0;fb('','');render()});
$('mode-explorar').addEventListener('click',()=>{st.mode='explorar';fb('','');render()});
reset();
})();
</script>
